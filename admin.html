<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Waqqti</title>
  <link rel="icon" href="/assets/logo.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js" defer></script>
  <style>
    :root { --or:#F68423; --or-dk:#D26F1A; --cream:#FDEFE2; --cream2:#F5E2CC; --brun:#3D1F00; --brun-l:#7A5030; --green:#2D9E5F; --red:#E0454C; --blue:#4A6FE0 }
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box }
    body { font-family:'DM Sans',sans-serif; background:#FAF7F3; color:var(--brun); padding:30px }
    .container { max-width:1100px; margin:0 auto }
    h1 { font-family:'Cormorant Garamond',serif; font-size:36px; color:var(--brun); margin-bottom:6px }
    .sub { color:var(--brun-l); margin-bottom:30px }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px }
    .card { background:#fff; border-radius:18px; padding:28px; box-shadow:0 2px 16px rgba(0,0,0,.04); border:1px solid #EEE7DC }
    .card h2 { font-family:'Cormorant Garamond',serif; font-size:22px; margin-bottom:18px; color:var(--brun) }
    .form-row { margin-bottom:14px }
    .form-row label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:var(--brun) }
    .form-row input, .form-row select { width:100%; padding:11px 14px; border:1.5px solid #F5E2CC; border-radius:10px; font-size:14px; font-family:inherit }
    /* Cases à cocher des catégories : ne pas hériter du width:100% */
    #new-cats { display:flex; flex-wrap:wrap; gap:8px }
    #new-cats label { display:inline-flex; align-items:center; gap:8px; background:var(--cream); padding:8px 12px; border-radius:10px; font-size:13px; font-weight:500; cursor:pointer; border:1.5px solid transparent }
    #new-cats label:hover { border-color:var(--cream2) }
    #new-cats input[type=checkbox] { width:18px; height:18px; flex:0 0 auto; margin:0; padding:0; accent-color:var(--or) }
    .form-row input:focus, .form-row select:focus { outline:none; border-color:var(--or); box-shadow:0 0 0 4px rgba(246,132,35,.1) }
    .form-flex { display:flex; gap:10px }
    .form-flex > div { flex:1 }
    .btn { padding:12px 22px; background:var(--or); color:#fff; border:none; border-radius:50px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .2s }
    .btn:hover:not(:disabled) { background:var(--or-dk) }
    .btn:disabled { opacity:.5 }
    .salon-list { max-height:600px; overflow-y:auto }
    .salon-item { padding:14px; border:1px solid #EEE7DC; border-radius:12px; margin-bottom:10px; display:flex; align-items:center; gap:12px }
    .salon-item-info { flex:1 }
    .salon-name { font-weight:600; font-size:14px }
    .salon-meta { font-size:12px; color:var(--brun-l); margin-top:2px }
    .badge { padding:3px 9px; border-radius:50px; font-size:11px; font-weight:600 }
    .badge.trial { background:#FFF4E0; color:#B47700 }
    .badge.essentielle { background:#E0EAFF; color:#3050C0 }
    .badge.confort { background:#FFE5D0; color:var(--or-dk) }
    .badge.premium { background:#F0E0FF; color:#7530C0 }
    .salon-actions { display:flex; gap:6px }
    .icon-btn { padding:6px 12px; background:var(--cream); border:none; border-radius:8px; cursor:pointer; font-size:12px; font-family:inherit }
    .icon-btn:hover { background:var(--cream2) }
    .alert { padding:12px; border-radius:10px; font-size:13px; margin-bottom:14px; display:none }
    .alert.show { display:block }
    .alert.success { background:#E6F7EE; color:#1A7A4A; border:1px solid #A8E0C0 }
    .alert.error { background:#FEE; color:#C03; border:1px solid #FCC }
    .link-output { background:var(--cream); padding:12px; border-radius:8px; font-family:monospace; font-size:13px; margin-top:8px; word-break:break-all; display:none }
    .link-output.show { display:block }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px }
    .stat { background:#fff; padding:18px; border-radius:14px; border:1px solid #EEE7DC; text-align:center }
    .stat-val { font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:700; color:var(--or) }
    .stat-lbl { font-size:12px; color:var(--brun-l); margin-top:2px }
  </style>
</head>
<body>

<a href="#" title="Retour" aria-label="Retour" onclick="if(history.length>1){history.back()}else{location.href='/'}return false;" style="position:fixed;top:16px;left:16px;z-index:1000;width:44px;height:44px;border-radius:50%;background:#fff;color:#3D1F00;display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.18)">←</a>

<div class="container">
  <h1>👑 Admin Waqqti</h1>
  <p class="sub">Créer et gérer les comptes salons</p>

  <div class="stats">
    <div class="stat"><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Salons total</div></div>
    <div class="stat"><div class="stat-val" id="stat-trial">—</div><div class="stat-lbl">En essai</div></div>
    <div class="stat"><div class="stat-val" id="stat-paid">—</div><div class="stat-lbl">Abonnés</div></div>
  </div>

  <div class="grid">

    <!-- CRÉATION SALON -->
    <div class="card">
      <h2>+ Nouveau salon partenaire</h2>

      <div class="alert" id="create-alert"></div>

      <form id="create-form">
        <div class="form-row">
          <label>Nom du salon *</label>
          <input type="text" id="new-nom" placeholder="Salon Yasmine Beauty" required>
        </div>

        <div class="form-row">
          <label>Slug URL * <small style="color:var(--brun-l);font-weight:400">(waqqti.com/<span id="slug-preview">slug</span>)</small></label>
          <input type="text" id="new-slug" placeholder="yasmine-beauty" required pattern="[a-z0-9-]+">
        </div>

        <div class="form-flex">
          <div class="form-row">
            <label>Téléphone</label>
            <input type="tel" id="new-tel" placeholder="0770 12 34 56">
          </div>
          <div class="form-row">
            <label>Wilaya</label>
            <input type="text" id="new-wilaya" placeholder="Alger">
          </div>
        </div>

        <div class="form-row">
          <label>Adresse</label>
          <input type="text" id="new-adresse" placeholder="Rue Didouche Mourad, Alger Centre">
        </div>

        <div class="form-row">
          <label>Email du gérant <small style="color:var(--brun-l);font-weight:400">(pour lier / créer son compte)</small></label>
          <input type="email" id="new-gerant" placeholder="gerant@salon.dz">
        </div>

        <div class="form-row">
          <label>Mot de passe gérant <small style="color:var(--brun-l);font-weight:400">(optionnel — crée le compte directement)</small></label>
          <input type="text" id="new-mdp" placeholder="min. 6 caractères" autocomplete="off">
        </div>

        <div class="form-flex">
          <div class="form-row">
            <label>Formule</label>
            <select id="new-formule">
              <option value="trial">Essai 30j (gratuit)</option>
              <option value="essentielle">Essentielle</option>
              <option value="confort">Confort</option>
              <option value="premium">Premium</option>
            </select>
          </div>
          <div class="form-row">
            <label>Nb sièges (Essentielle)</label>
            <input type="number" id="new-sieges" value="1" min="1" max="20">
          </div>
        </div>

        <div class="form-row">
          <label>Mode de réservation</label>
          <select id="new-mode">
            <option value="creneau">Par créneau (jour + heure)</option>
            <option value="journee">À la journée (jour seulement, sans heure)</option>
          </select>
        </div>

        <div class="form-row">
          <label>Genre / cible</label>
          <select id="new-genre" onchange="renderCats()">
            <option value="">— À préciser —</option>
            <option value="homme">Hommes</option>
            <option value="femme">Femmes</option>
            <option value="mixte">Mixte (hommes & femmes)</option>
          </select>
        </div>

        <div class="form-row">
          <label>Catégories / spécialités</label>
          <div id="new-cats" style="display:flex;flex-wrap:wrap;gap:8px">—</div>
        </div>

        <button type="submit" class="btn" style="width:100%">Créer le salon</button>
      </form>

      <div class="link-output" id="result-link"></div>
    </div>

    <!-- LISTE SALONS -->
    <div class="card">
      <h2>📋 Salons partenaires</h2>
      <input type="text" id="search" placeholder="🔍 Rechercher..."
             style="width:100%; padding:10px 14px; border:1.5px solid #F5E2CC; border-radius:10px; font-size:14px; margin-bottom:14px; font-family:inherit"
             oninput="filterSalons(this.value)">
      <div class="salon-list" id="salon-list">
        <div style="text-align:center; padding:30px; color:var(--brun-l)">Chargement...</div>
      </div>
    </div>

  </div>
</div>

<script>
let allSalons = [];

// ── Catégories (partagées avec l'annuaire) ──
const CAT_LABELS = {
  barber:'Barber & coiffure hommes', bienetre_h:'Bien-être hommes',
  coiffure_maquillage:'Coiffure & maquillage', onglerie:'Onglerie', spa:'Bien-être & spa',
  soin_visage:'Esthétique & soin du visage', regard:'Beauté du regard', mariage:'Mariage & événements'
};
const CATS_H = ['barber','bienetre_h'];
const CATS_F = ['coiffure_maquillage','onglerie','spa','soin_visage','regard','mariage'];
function catsForGenre(g){ return g==='homme'?CATS_H : g==='femme'?CATS_F : g==='mixte'?CATS_H.concat(CATS_F) : []; }
function renderCats(){
  const g = document.getElementById('new-genre').value;
  const box = document.getElementById('new-cats');
  const list = catsForGenre(g);
  if (!list.length){ box.innerHTML = '<span style="color:var(--brun-l);font-size:13px">Choisis d\'abord le genre</span>'; return; }
  box.innerHTML = list.map(c =>
    '<label><input type="checkbox" class="cat-cb" value="'+c+'"><span>'+CAT_LABELS[c]+'</span></label>').join('');
}

// Auto-générer le slug
document.getElementById('new-nom').addEventListener('input', e => {
  const slug = e.target.value.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  document.getElementById('new-slug').value = slug;
  document.getElementById('slug-preview').textContent = slug || 'slug';
});

document.getElementById('new-slug').addEventListener('input', e => {
  document.getElementById('slug-preview').textContent = e.target.value || 'slug';
});

// CRÉATION SALON
document.getElementById('create-form').addEventListener('submit', async e => {
  e.preventDefault();
  const alert = document.getElementById('create-alert');
  alert.className = 'alert';

  const payload = {
    nom:      document.getElementById('new-nom').value.trim(),
    slug:     document.getElementById('new-slug').value.trim(),
    telephone: document.getElementById('new-tel').value.trim() ? WAQQTI.formatPhone(document.getElementById('new-tel').value.trim()) : null,
    wilaya:   document.getElementById('new-wilaya').value.trim() || null,
    adresse:  document.getElementById('new-adresse').value.trim() || null,
    formule:  document.getElementById('new-formule').value,
    mode_reservation: document.getElementById('new-mode').value,
    nb_sieges: parseInt(document.getElementById('new-sieges').value) || 1,
    genre: document.getElementById('new-genre').value || null,
    categories: Array.from(document.querySelectorAll('.cat-cb:checked')).map(x => x.value),
  };

  const { data, error } = await WAQQTI.supabase
    .from('salons').insert(payload).select().single();

  if (error) {
    alert.className = 'alert show error';
    alert.textContent = '❌ ' + error.message;
    return;
  }

  alert.className = 'alert show success';
  alert.textContent = '✅ Salon créé avec succès !';

  // Compte gérant
  let gerantMsg = '';
  const gerantEmail = document.getElementById('new-gerant').value.trim();
  const gerantMdp = document.getElementById('new-mdp').value.trim();
  if (gerantEmail && gerantMdp) {
    // Créer le compte (email + mot de passe) via l'Edge Function sécurisée
    const res = await creerCompteGerant(data.id, gerantEmail, gerantMdp);
    if (res.ok) {
      gerantMsg = `<br><br>✅ <b>Compte gérant ${res.created ? 'créé' : 'mis à jour'} & lié</b><br>
        <div style="background:#fff;border:1px solid #EEE7DC;border-radius:8px;padding:10px;margin-top:6px">
        🔗 <b>/pro/dashboard.html</b><br>📧 <b>${gerantEmail}</b><br>🔑 <b>${gerantMdp}</b></div>
        <span style="color:var(--brun-l)">Transmets ces identifiants au gérant.</span>`;
    } else {
      gerantMsg = `<br><br><b style="color:#C03">⚠️ Compte non créé :</b> ${res.error}`;
    }
  } else if (gerantEmail) {
    const lk = await WAQQTI.supabase.rpc('lier_salon_owner', { p_salon_id: data.id, p_email: gerantEmail });
    if (lk.error) {
      gerantMsg = `<br><br><b style="color:#C03">⚠️ Gérant non lié :</b> ${lk.error.message}<br>
        → Renseigne aussi un <b>mot de passe</b> pour créer le compte directement, ou clique <b>🔑 Compte</b> sur le salon.`;
    } else {
      gerantMsg = `<br><br>✅ <b>Gérant lié</b> (${gerantEmail}) — il peut se connecter à /pro/dashboard.html.`;
    }
  } else {
    gerantMsg = `<br><br><span style="color:var(--brun-l)">ℹ️ Renseigne l'email + un mot de passe pour créer le compte du gérant, ou fais-le plus tard via <b>🔑 Compte</b>.</span>`;
  }

  // Afficher le lien
  const link = document.getElementById('result-link');
  link.className = 'link-output show';
  link.innerHTML = `
    <strong>Lien public à envoyer au salon :</strong><br>
    <span style="color:var(--or)">https://waqqti.com/${data.slug}</span><br><br>
    <strong>Message WhatsApp prêt à envoyer :</strong><br>
    <em>Bonjour ${data.nom}, votre espace Waqqti est prêt ! 🎉<br>
    Votre lien de réservation : https://waqqti.com/${data.slug}<br>
    Envoyez-moi vos prestations pour qu'on les ajoute.</em>
    ${gerantMsg}
  `;

  document.getElementById('create-form').reset();
  renderCats();
  loadSalons();
});

// CHARGER LES SALONS
async function loadSalons() {
  const { data, error } = await WAQQTI.supabase
    .from('salons').select('*').order('created_at', { ascending: false });

  if (error) { console.error(error); return; }

  allSalons = data || [];

  // Stats
  document.getElementById('stat-total').textContent = allSalons.length;
  document.getElementById('stat-trial').textContent = allSalons.filter(s => s.formule === 'trial').length;
  document.getElementById('stat-paid').textContent = allSalons.filter(s => ['essentielle','confort','premium'].includes(s.formule)).length;

  renderSalons(allSalons);
}

function renderSalons(salons) {
  const list = document.getElementById('salon-list');
  if (!salons.length) {
    list.innerHTML = '<div style="text-align:center; padding:30px; color:var(--brun-l)">Aucun salon</div>';
    return;
  }

  list.innerHTML = salons.map(s => {
    const daysLeft = s.trial_end_date ? Math.ceil((new Date(s.trial_end_date) - new Date()) / 86400000) : null;
    const trialInfo = s.formule === 'trial' && daysLeft !== null
      ? ` · ${daysLeft > 0 ? daysLeft + 'j restants' : 'EXPIRÉ'}`
      : '';
    return `
      <div class="salon-item">
        <div class="salon-item-info">
          <div class="salon-name">${s.nom}</div>
          <div class="salon-meta">
            <span class="badge ${s.formule}">${s.formule}</span>
            ${trialInfo} · ${s.wilaya || '—'}
          </div>
          <div class="salon-meta" style="margin-top:4px; font-family:monospace">/${s.slug}</div>
        </div>
        <div class="salon-actions">
          <button class="icon-btn" onclick="copyLink('${s.slug}')">📋 Lien</button>
          <button class="icon-btn" onclick="changeFormule('${s.id}', '${s.formule}')">⚡ Formule</button>
          <button class="icon-btn" onclick="renouvelerEssai('${s.id}', '${s.nom.replace(/'/g,'')}')">♻️ Essai +30j</button>
          <button class="icon-btn" onclick="gererCompte('${s.id}', '${s.nom.replace(/'/g,'')}')">🔑 Compte</button>
          <button class="icon-btn" onclick="lierGerant('${s.id}', '${s.nom.replace(/'/g,'')}')">👤 Lier</button>
          <button class="icon-btn" style="background:#FDE7E8;color:#C0272E" onclick="supprimerSalon('${s.id}', '${s.nom.replace(/'/g,'')}')">🗑 Supprimer</button>
        </div>
      </div>
    `;
  }).join('');
}

function filterSalons(q) {
  q = q.toLowerCase();
  const filtered = allSalons.filter(s =>
    s.nom.toLowerCase().includes(q) ||
    s.slug.toLowerCase().includes(q) ||
    (s.wilaya || '').toLowerCase().includes(q)
  );
  renderSalons(filtered);
}

function copyLink(slug) {
  navigator.clipboard.writeText(`https://waqqti.com/${slug}`);
  WAQQTI.toast('Lien copié !');
}

// Lier un salon à un compte gérant (le gérant doit s'être inscrit via /pro/dashboard.html)
async function lierGerant(id, nom) {
  const email = prompt(`Lier le salon « ${nom} » à un compte gérant.\n\nEmail du gérant (il doit déjà s'être inscrit) :`);
  if (!email) return;
  const { error } = await WAQQTI.supabase.rpc('lier_salon_owner', {
    p_salon_id: id, p_email: email.trim()
  });
  if (error) WAQQTI.toast(error.message, 'error');
  else { WAQQTI.toast('Salon lié à ' + email); loadSalons(); }
}

// Créer / réinitialiser le compte gérant (email + mot de passe) via Edge Function
async function creerCompteGerant(salonId, email, password){
  try{
    const { data, error } = await WAQQTI.supabase.functions.invoke('creer-compte-gerant', {
      body: { salon_id: salonId, email: email, password: password }
    });
    if (error) {
      let msg = error.message || 'Erreur';
      try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch(e){}
      return { ok:false, error: msg };
    }
    if (data && data.error) return { ok:false, error: data.error };
    return { ok:true, created: !!(data && data.created) };
  } catch(e){ return { ok:false, error: String(e) }; }
}
async function gererCompte(id, nom){
  const email = prompt(`Compte gérant pour « ${nom} »\n\nEmail :`);
  if (!email) return;
  const mdp = prompt('Mot de passe (min. 6 caractères) :');
  if (!mdp) return;
  const res = await creerCompteGerant(id, email.trim(), mdp.trim());
  if (res.ok) { WAQQTI.toast('Compte ' + (res.created ? 'créé' : 'mis à jour') + ' ✓'); loadSalons(); }
  else WAQQTI.toast(res.error, 'error');
}

// Renouveler l'essai de 30 jours (repasse en trial + nouvelle date de fin)
async function renouvelerEssai(id, nom) {
  if (!confirm(`Renouveler l'essai de « ${nom} » pour 30 jours ?`)) return;
  const { error } = await WAQQTI.supabase.rpc('admin_renouveler_essai', { p_salon_id: id });
  if (error) WAQQTI.toast(error.message, 'error');
  else { WAQQTI.toast('Essai renouvelé (+30 jours) ✓'); loadSalons(); }
}

// Supprimer un salon (et tout ce qui lui est rattaché via ON DELETE CASCADE)
async function supprimerSalon(id, nom) {
  if (!confirm(`⚠️ Supprimer définitivement « ${nom} » ?\n\nToutes ses prestations, réservations, avis et photos seront supprimés. Action irréversible.`)) return;
  const saisie = prompt(`Pour confirmer, tape le nom exact du salon :\n« ${nom} »`);
  if (saisie === null) return;
  if (saisie.trim() !== nom.trim()) { WAQQTI.toast('Nom incorrect — suppression annulée', 'error'); return; }
  const { error } = await WAQQTI.supabase.rpc('admin_supprimer_salon', { p_salon_id: id });
  if (error) { WAQQTI.toast(error.message, 'error'); return; }
  WAQQTI.toast('Salon supprimé ✓');
  loadSalons();
}

async function changeFormule(id, current) {
  const formules = ['trial', 'essentielle', 'confort', 'premium'];
  const choix = prompt(`Changer la formule (actuelle: ${current})\n\n1 = trial\n2 = essentielle\n3 = confort\n4 = premium`);
  if (!choix || !['1','2','3','4'].includes(choix)) return;

  const newFormule = formules[parseInt(choix) - 1];
  const { error } = await WAQQTI.supabase
    .from('salons').update({ formule: newFormule }).eq('id', id);

  if (error) WAQQTI.toast(error.message, 'error');
  else { WAQQTI.toast(`Formule changée : ${newFormule}`); loadSalons(); }
}

window.addEventListener('load', async () => {
  await new Promise(r => setTimeout(r, 300));
  if (!window.WAQQTI) return;

  // 1. Vérifie si tu es déjà connecté
  const { data: { session } } = await WAQQTI.supabase.auth.getSession();

  if (!session) {
    // 2. Sinon, on te demande tes identifiants
    const email = prompt("Email Administrateur :");
    const password = prompt("Mot de passe :");
    const { error } = await WAQQTI.supabase.auth.signInWithPassword({ email: email, password: password });

    if (error) {
      alert("Erreur de connexion : " + error.message);
      return;
    }
  }

  // 3. Charger la liste des salons
  renderCats();
  loadSalons();
});
</script>

</body>
</html>
