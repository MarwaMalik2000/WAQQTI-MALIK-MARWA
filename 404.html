<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page introuvable — Waqqti</title>
  <link rel="icon" href="/assets/logo.svg"/>
  <meta name="robots" content="noindex"/>
  <meta name="description" content="Cette page n'existe pas ou a été déplacée. Retournez à l'accueil de Waqqti."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --or:#F68423; --or-dk:#D26F1A; --cream:#FDEFE2; --brun:#3D1F00; --brun-l:#7A5030;
      --ease:cubic-bezier(.22,.9,.32,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--brun);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      text-align:center;padding:24px;-webkit-font-smoothing:antialiased;
    }
    .box{max-width:520px}
    .logo{width:72px;height:72px;margin:0 auto 28px;opacity:.95}
    .code{
      font-family:'Cormorant Garamond',serif;font-weight:700;
      font-size:clamp(88px,22vw,160px);line-height:.9;letter-spacing:-.04em;
      color:var(--or);
    }
    h1{
      font-family:'Cormorant Garamond',serif;font-weight:600;
      font-size:clamp(26px,6vw,34px);letter-spacing:-.02em;margin:8px 0 14px;
    }
    p{font-size:16px;line-height:1.6;color:var(--brun-l);margin-bottom:32px}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{
      display:inline-flex;align-items:center;gap:8px;text-decoration:none;
      padding:14px 26px;border-radius:50px;font-weight:500;font-size:15px;
      transition:transform .2s var(--ease),box-shadow .2s var(--ease);
    }
    .btn:active{transform:scale(.97)}
    .btn-primary{background:var(--or);color:#fff;box-shadow:0 8px 30px rgba(246,132,35,.28)}
    .btn-primary:hover{background:var(--or-dk)}
    .btn-ghost{background:transparent;color:var(--brun);border:1px solid rgba(61,31,0,.18)}
    .btn-ghost:hover{border-color:var(--or)}
    .ar{margin-top:26px;font-size:14px;color:var(--brun-l);opacity:.75;direction:rtl}
  </style>
</head>
<body>
  <main class="box">
    <img class="logo" src="/assets/logo.svg" alt="Waqqti"/>
    <div class="code">404</div>
    <h1>Cette page est introuvable</h1>
    <p>Le lien est peut-être cassé, ou la page a été déplacée. Pas d'inquiétude, on vous ramène au bon endroit.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Retour à l'accueil</a>
      <a class="btn btn-ghost" href="/annuaire.html">Trouver un salon</a>
    </div>
    <p class="ar">الصفحة غير موجودة — عُد إلى الصفحة الرئيسية</p>
  </main>
</body>
</html>
