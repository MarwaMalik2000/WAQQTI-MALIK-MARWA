<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Espace client — Waqqti</title>
  <meta name="theme-color" content="#F68423"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js" defer></script>
  <style>
    :root{--or:#F68423;--or-dk:#D26F1A;--cream:#FDEFE2;--cream2:#F5E2CC;--brun:#3D1F00;--brun-l:#7A5030;--green:#2D9E5F;--red:#E0454C}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;background:linear-gradient(135deg,var(--or),var(--or-dk));color:var(--brun)}
    .card{background:#fff;border-radius:22px;padding:36px 30px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .logo{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:700;color:var(--or);text-align:center}
    .sub{text-align:center;color:var(--brun-l);font-size:14px;margin-bottom:24px}
    .field{margin-bottom:13px}
    .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
    .field input{width:100%;padding:12px 14px;border:1.5px solid var(--cream2);border-radius:11px;font-size:14px;font-family:inherit}
    .field input:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 4px rgba(246,132,35,.1)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{padding:12px 20px;background:var(--or);color:#fff;border:none;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;transition:.2s}
    .btn:hover:not(:disabled){background:var(--or-dk)}
    .btn:disabled{opacity:.5}
    .btn-google{background:#fff;color:var(--brun);border:1.5px solid var(--cream2);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
    .btn-google:hover{background:var(--cream)}
    .sep{text-align:center;color:var(--brun-l);font-size:12px;margin-bottom:14px}
    .err{font-size:13px;margin-top:12px;min-height:16px;text-align:center}
    .toggle{text-align:center;font-size:13px;margin-top:16px}
    .toggle a{color:var(--or);font-weight:600;text-decoration:none}
    .hidden{display:none!important}
    .home{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--brun-l);text-decoration:none}
    /* écran connecté */
    #account .big{width:64px;height:64px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;margin:0 auto 14px}
    #account h2{font-family:'Cormorant Garamond',serif;text-align:center;font-size:26px;margin-bottom:4px}
    #account .em{text-align:center;color:var(--brun-l);font-size:14px;margin-bottom:22px}
  </style>
</head>
<body>
  <form class="card" id="auth-card">
    <div class="logo">وقتي</div>
    <div class="sub" id="sub">Espace client Waqqti</div>

    <button type="button" class="btn btn-google" id="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuer avec Google
    </button>
    <div class="sep">— ou —</div>

    <div class="signup-only hidden">
      <div class="grid2">
        <div class="field"><label>Prénom</label><input type="text" id="prenom" placeholder="Amina"/></div>
        <div class="field"><label>Nom</label><input type="text" id="nom" placeholder="Kaci"/></div>
      </div>
    </div>
    <div class="field"><label>Email</label><input type="email" id="email" required placeholder="vous@exemple.dz"/></div>
    <div class="field"><label>Mot de passe</label><input type="password" id="password" required placeholder="••••••••"/></div>
    <div class="signup-only hidden">
      <div class="field"><label>Confirmer le mot de passe</label><input type="password" id="confirm" placeholder="••••••••"/></div>
    </div>

    <button type="submit" class="btn" id="submit">Se connecter</button>
    <div class="err" id="err"></div>
    <div class="toggle"><span id="toggle-txt">Pas encore de compte ?</span>
      <a href="#" id="toggle">Créer un compte</a></div>
    <a class="home" href="/">← Retour à l'accueil</a>
  </form>

  <!-- Écran connecté -->
  <div class="card hidden" id="account">
    <div class="big" id="ac-init">?</div>
    <h2 id="ac-name">Bienvenue</h2>
    <div class="em" id="ac-email"></div>
    <a class="btn" href="/annuaire.html" style="display:block;text-align:center;margin-bottom:12px">Trouver un salon →</a>
    <button class="btn btn-google" id="btn-logout">Se déconnecter</button>
    <a class="home" href="/">← Retour à l'accueil</a>
  </div>

<script>
function sb(){ return window.WAQQTI && window.WAQQTI.supabase; }
var SIGNUP=false;

function toggleMode(){
  SIGNUP=!SIGNUP;
  document.querySelectorAll('.signup-only').forEach(function(el){ el.classList.toggle('hidden',!SIGNUP); });
  document.getElementById('submit').textContent = SIGNUP?'Créer mon compte':'Se connecter';
  document.getElementById('sub').textContent = SIGNUP?'Créer un compte client':'Espace client Waqqti';
  document.getElementById('toggle-txt').textContent = SIGNUP?'Déjà un compte ?':'Pas encore de compte ?';
  document.getElementById('toggle').textContent = SIGNUP?'Se connecter':'Créer un compte';
  document.getElementById('err').textContent='';
}

async function showAccount(user){
  var prof=null;
  var r=await sb().from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!r.error) prof=r.data;
  document.getElementById('auth-card').classList.add('hidden');
  document.getElementById('account').classList.remove('hidden');
  var prenom=(prof&&prof.prenom)|| (user.user_metadata&&user.user_metadata.prenom) || '';
  var nom=(prof&&prof.nom)|| (user.user_metadata&&user.user_metadata.nom) || '';
  var label=(prenom+' '+nom).trim() || user.email;
  document.getElementById('ac-init').textContent=(label.charAt(0)||'?').toUpperCase();
  document.getElementById('ac-name').textContent='Bonjour '+(prenom||label)+' 👋';
  document.getElementById('ac-email').textContent=user.email;
}

async function onSubmit(e){
  e.preventDefault();
  var err=document.getElementById('err'); err.style.color='var(--red)'; err.textContent='';
  var email=document.getElementById('email').value.trim();
  var password=document.getElementById('password').value;
  var btn=document.getElementById('submit');
  if(SIGNUP){
    var confirm=document.getElementById('confirm').value;
    var nom=document.getElementById('nom').value.trim();
    var prenom=document.getElementById('prenom').value.trim();
    if(password.length<6){ err.textContent='Mot de passe : 6 caractères minimum'; return; }
    if(password!==confirm){ err.textContent='Les mots de passe ne correspondent pas'; return; }
    btn.disabled=true; btn.textContent='Création…';
    var s=await WAQQTI.inscriptionEmail(email,password,{nom:nom,prenom:prenom});
    btn.disabled=false; btn.textContent='Créer mon compte';
    if(s.error){ err.textContent=s.error.message; return; }
    if(s.data && s.data.session){ showAccount(s.data.user); }
    else { err.style.color='var(--green)'; err.textContent='✅ Compte créé. Vérifiez votre email pour confirmer.'; toggleMode(); }
  } else {
    btn.disabled=true; btn.textContent='Connexion…';
    var l=await sb().auth.signInWithPassword({email:email,password:password});
    btn.disabled=false; btn.textContent='Se connecter';
    if(l.error){ err.textContent=l.error.message; return; }
    showAccount(l.data.user);
  }
}

function boot(){
  if(!sb()){ return setTimeout(boot,60); }
  document.getElementById('auth-card').addEventListener('submit', onSubmit);
  document.getElementById('toggle').addEventListener('click', function(e){ e.preventDefault(); toggleMode(); });
  document.getElementById('btn-google').addEventListener('click', function(){ WAQQTI.loginGoogle(window.location.href); });
  document.getElementById('btn-logout').addEventListener('click', async function(){ await sb().auth.signOut(); location.reload(); });
  sb().auth.getSession().then(function(res){
    var session=res && res.data && res.data.session;
    if(session && session.user) showAccount(session.user);
  });
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
